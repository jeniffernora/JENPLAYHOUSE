<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talk With Us — Jen Play House</title>
  <meta name="theme-color" content="#7A0F24">
  <style>
    :root{
      --maroon:#7A0F24;
      --cherry:#C92F45;
      --pink:#F7C6D0;
      --blush:#FBE3E8;
      --cream:#F8F0E6;
      --ivory:#FFF9F4;
      --rose:#B86A78;
      --espresso:#2A1718;
      --lavender:#D9D3FF;
      --line:rgba(122,15,36,.14);
      --shadow:0 18px 60px rgba(42,23,24,.08);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      color:var(--espresso);
      background:
        radial-gradient(circle at 20% 0%, rgba(247,198,208,.24), transparent 34rem),
        linear-gradient(180deg,var(--ivory),#fff 70%);
      font-family:Arial,Helvetica,sans-serif;
      min-height:100vh;
    }

    button,input{font:inherit}
    button{cursor:pointer}

    .talk-topbar{
      position:sticky;
      top:0;
      z-index:20;
      background:rgba(255,249,244,.92);
      backdrop-filter:blur(16px);
      border-bottom:1px solid var(--line);
    }

    .talk-topbar-inner{
      max-width:1120px;
      margin:auto;
      min-height:72px;
      padding:0 24px;
      display:flex;
      align-items:center;
      gap:16px;
    }

    .talk-back{
      width:42px;height:42px;border-radius:50%;
      border:1px solid var(--line);
      background:#fff;
      color:var(--espresso);
      display:grid;place-items:center;
      text-decoration:none;
      font-size:22px;
      flex:0 0 auto;
    }

    .talk-brand{
      font-family:Georgia,"Times New Roman",serif;
      font-size:1.15rem;
      color:var(--maroon);
      margin-right:auto;
    }

    .talk-readonly{
      font-size:.78rem;
      color:var(--rose);
      border:1px solid var(--line);
      border-radius:999px;
      padding:8px 12px;
      background:#fff;
    }

    .talk-shell{
      max-width:1120px;
      margin:auto;
      padding:54px 24px 90px;
    }

    .talk-hero{
      margin-bottom:34px;
    }

    .talk-eyebrow{
      color:var(--maroon);
      text-transform:uppercase;
      letter-spacing:.28em;
      font-size:.68rem;
      margin:0 0 12px;
    }

    .talk-title{
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(3rem,8vw,6rem);
      line-height:.92;
      font-weight:500;
      margin:0;
      color:#111;
    }

    .talk-subtitle{
      margin:18px 0 0;
      color:#7b6267;
      max-width:620px;
      font-size:1rem;
    }

    .talk-list{
      border-top:1px solid var(--line);
    }

    .talk-person{
      width:100%;
      border:0;
      background:transparent;
      display:grid;
      grid-template-columns:78px minmax(0,1fr) auto;
      gap:18px;
      align-items:center;
      padding:22px 8px;
      border-bottom:1px solid var(--line);
      text-align:left;
      color:inherit;
    }

    .talk-person:hover{
      background:linear-gradient(90deg,rgba(247,198,208,.16),transparent);
    }

    .talk-avatar{
      width:68px;height:68px;border-radius:50%;
      object-fit:cover;
      border:3px solid #fff;
      outline:1px solid rgba(122,15,36,.18);
      background:var(--blush);
    }

    .talk-person-main{min-width:0}
    .talk-person-name{
      display:flex;
      align-items:center;
      gap:6px;
      font-size:1.35rem;
      font-weight:700;
      margin-bottom:7px;
    }

    .talk-verified{
      width:16px;height:16px;border-radius:50%;
      display:inline-grid;place-items:center;
      font-size:10px;color:#fff;background:#44b8db;
      flex:0 0 auto;
    }

    .talk-preview{
      color:#77646a;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      font-size:1rem;
    }

    .talk-chevron{
      color:var(--maroon);
      font-size:1.4rem;
      padding-right:8px;
    }

    .room{
      display:none;
      min-height:calc(100vh - 72px);
      background:
        linear-gradient(180deg,rgba(247,198,208,.42),rgba(255,249,244,.92) 20%,#fff 60%);
    }

    body.room-open .talk-index{display:none}
    body.room-open .room{display:block}

    .room-header{
      position:sticky;
      top:72px;
      z-index:15;
      background:rgba(255,249,244,.94);
      backdrop-filter:blur(14px);
      border-bottom:1px solid var(--line);
    }

    .room-header-inner{
      max-width:820px;
      margin:auto;
      padding:13px 20px;
      display:grid;
      grid-template-columns:42px 46px minmax(0,1fr) 42px;
      align-items:center;
      gap:10px;
    }

    .room-close,.room-menu{
      width:42px;height:42px;
      border-radius:50%;
      border:1px solid rgba(42,23,24,.16);
      background:#fff;
      color:#111;
      display:grid;place-items:center;
      font-size:21px;
    }

    .room-avatar{
      width:44px;height:44px;border-radius:50%;
      object-fit:cover;
      background:var(--blush);
    }

    .room-person-name{
      font-weight:700;
      display:flex;
      align-items:center;
      gap:5px;
      min-width:0;
    }

    .room-role{
      font-size:.75rem;
      color:#9a7b83;
      margin-top:2px;
    }

    .room-body{
      max-width:820px;
      margin:auto;
      padding:36px 20px 130px;
    }

    .message{
      display:grid;
      grid-template-columns:42px minmax(0,1fr);
      gap:10px;
      align-items:end;
      margin:0 0 22px;
    }

    .message-avatar{
      width:38px;height:38px;border-radius:50%;object-fit:cover;
      background:var(--blush);
    }

    .message-stack{min-width:0}
    .message-author{
      font-size:.78rem;
      font-weight:700;
      margin:0 0 6px 3px;
      color:#4d373c;
    }

    .message-bubble{
      width:fit-content;
      max-width:min(620px,86vw);
      border:1.5px solid rgba(42,23,24,.78);
      border-radius:26px 26px 26px 8px;
      background:
        linear-gradient(180deg,#fffdfb 0%,#fff7f8 42%,#f7c6d0 100%);
      padding:16px 18px;
      box-shadow:0 6px 18px rgba(122,15,36,.05);
      font-size:1rem;
      line-height:1.35;
      overflow:hidden;
    }

    .message-time{
      display:inline-block;
      font-size:.72rem;
      font-weight:700;
      color:#7a666b;
      margin:7px 0 0 8px;
    }

    .message-media{
      width:min(540px,78vw);
      display:block;
      border-radius:18px;
      object-fit:cover;
      max-height:640px;
      background:#eee;
    }

    .video-wrap{
      position:relative;
      width:min(540px,78vw);
    }

    .video-wrap .message-media{width:100%}
    .video-play{
      position:absolute;
      inset:50% auto auto 50%;
      transform:translate(-50%,-50%);
      width:64px;height:64px;border-radius:50%;
      background:rgba(255,249,244,.92);
      border:1.5px solid rgba(42,23,24,.65);
      display:grid;place-items:center;
      font-size:25px;
      color:var(--maroon);
      pointer-events:none;
    }

    .voice-note{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:260px;
    }
    .voice-icon{
      width:38px;height:38px;border-radius:50%;
      display:grid;place-items:center;
      background:var(--maroon);color:#fff;
    }
    .voice-wave{
      flex:1;
      height:30px;
      display:flex;
      align-items:center;
      gap:3px;
    }
    .voice-wave i{
      width:3px;
      border-radius:999px;
      background:var(--maroon);
      opacity:.68;
    }
    .voice-duration{font-size:.75rem;color:#765f65}

    .message-actions{
      margin:8px 0 0 4px;
    }
    .share-message{
      border:0;
      background:transparent;
      color:var(--cherry);
      padding:0;
      font-size:.78rem;
      letter-spacing:.02em;
    }

    .room-input{
      position:fixed;
      left:0;right:0;bottom:0;
      z-index:20;
      background:var(--cream);
      border-top:1px solid var(--line);
      padding:15px 20px max(15px,env(safe-area-inset-bottom));
    }
    .room-input-inner{
      max-width:820px;
      margin:auto;
      display:grid;
      grid-template-columns:1fr 48px;
      gap:10px;
    }
    .room-input input{
      height:52px;border-radius:999px;border:1.5px solid rgba(42,23,24,.6);
      background:#fff;padding:0 20px;color:#8b777c;
    }
    .room-send{
      width:48px;height:48px;border-radius:50%;
      border:1.5px solid rgba(42,23,24,.6);
      background:var(--pink);
      color:var(--maroon);
      display:grid;place-items:center;
      font-size:20px;
    }

    .empty{
      color:#8f747b;
      padding:28px 0;
    }

    @media (max-width:700px){
      .talk-shell{padding:38px 18px 70px}
      .talk-topbar-inner{padding:0 16px}
      .talk-person{
        grid-template-columns:62px minmax(0,1fr) auto;
        gap:14px;
        padding:18px 2px;
      }
      .talk-avatar{width:56px;height:56px}
      .talk-person-name{font-size:1.08rem}
      .talk-preview{font-size:.9rem}
      .room-header{top:72px}
      .room-body{padding:26px 14px 125px}
      .message{grid-template-columns:36px minmax(0,1fr);gap:8px}
      .message-avatar{width:33px;height:33px}
    }
  </style>

    <!-- Talk With Us v1.6 login + composer -->
    <style>
      .talk-login-button{
        border:1px solid rgba(122,15,36,.22);
        background:#7A0F24;
        color:#FFF9F4;
        min-height:36px;
        padding:0 14px;
        border-radius:999px;
        font-size:.78rem;
      }
      .talk-login-user{
        font-size:.78rem;
        color:#7A0F24;
        white-space:nowrap;
      }
      .talk-modal[hidden]{display:none!important}
      .talk-modal{
        position:fixed;
        inset:0;
        z-index:100;
        background:rgba(42,23,24,.36);
        backdrop-filter:blur(7px);
        display:grid;
        place-items:center;
        padding:20px;
      }
      .talk-modal-card{
        width:min(520px,100%);
        border-radius:26px;
        background:#FFF9F4;
        border:1px solid rgba(122,15,36,.18);
        box-shadow:0 28px 80px rgba(42,23,24,.2);
        padding:28px;
        position:relative;
      }
      .talk-compose-card{width:min(600px,100%)}
      .talk-modal-close{
        position:absolute;
        top:16px;
        right:16px;
        width:36px;height:36px;
        border-radius:50%;
        border:1px solid rgba(122,15,36,.16);
        background:#fff;
        font-size:21px;
        color:#2A1718;
      }
      .talk-modal-eyebrow{
        margin:0 0 9px;
        color:#C92F45;
        text-transform:uppercase;
        letter-spacing:.2em;
        font-size:.66rem;
      }
      .talk-modal-card h2{
        margin:0 0 8px;
        font-family:Georgia,"Times New Roman",serif;
        font-size:2.2rem;
        font-weight:500;
        color:#7A0F24;
      }
      .talk-modal-copy{
        margin:0 0 22px;
        color:#8D7379;
        line-height:1.45;
      }
      .talk-field{
        display:grid;
        gap:7px;
        margin:0 0 16px;
      }
      .talk-field>span{
        font-size:.78rem;
        font-weight:700;
        color:#6D555B;
      }
      .talk-field input,
      .talk-field select,
      .talk-field textarea{
        width:100%;
        border:1px solid rgba(122,15,36,.18);
        border-radius:15px;
        background:#fff;
        color:#2A1718;
        padding:12px 14px;
        outline:none;
      }
      .talk-field small{color:#9A7B83}
      .talk-primary{
        width:100%;
        min-height:46px;
        border:0;
        border-radius:999px;
        background:#7A0F24;
        color:#FFF9F4;
        font-weight:700;
      }
      .talk-primary:disabled{opacity:.55;cursor:not-allowed}
      .talk-modal-status{
        margin-top:12px;
        min-height:20px;
        color:#8A515D;
        font-size:.82rem;
      }
      .room-send:not(:disabled){
        cursor:pointer;
        background:#7A0F24!important;
        color:#FFF9F4!important;
      }
      @media(max-width:700px){
        .talk-readonly{display:none}
        .talk-login-user{max-width:120px;overflow:hidden;text-overflow:ellipsis}
      }
    </style>

    <!-- TALK v1.12 GENDER THEME + IOS EMOJI -->
    <style>
      .talk-page,
      .talk-page *,
      .talk-room,
      .talk-room *{
        font-family:
          -apple-system,
          BlinkMacSystemFont,

      }

      /* theme classes are applied by talk.js */

          radial-gradient(circle at 18% 16%, rgba(255,170,195,.62) 0, rgba(255,170,195,.22) 26%, transparent 47%),
          radial-gradient(circle at 82% 36%, rgba(201,47,69,.16) 0, rgba(247,198,208,.28) 30%, transparent 52%),
          linear-gradient(180deg,#FFF7F6 0%,#FAD4DE 43%,#FFF8F3 76%,#F8F0E6 100%) !important;
      }

      .talk-room.theme-female .message-bubble{
        background:
          linear-gradient(
            180deg,
            #FFFDFB 0%,
            #FFF5F7 27%,
            #F7BFD0 70%,
            #EF94AE 100%
          ) !important;
        box-shadow:
          0 3px 0 rgba(42,23,24,.15),
          0 9px 20px rgba(169,32,70,.14) !important;
      }

      .talk-room.theme-male{
        background:
          radial-gradient(circle at 18% 16%, rgba(186,218,255,.64) 0, rgba(186,218,255,.22) 27%, transparent 47%),
          radial-gradient(circle at 82% 36%, rgba(88,136,205,.16) 0, rgba(216,230,255,.30) 30%, transparent 52%),

<style id="talk-mobile-alignment-v11625">
/* v1.16.25 — TALK MOBILE ALIGNMENT ONLY
   Base: v1.16.24
   Goal: live chat should read like a chat, not a centered poster.
   Desktop and share-image exporter are untouched. */

@media (max-width:700px){

  /* Main room content uses the phone width more naturally */
  .talk-room,
  .talk-room-inner,
  .talk-thread,
  .talk-thread-inner,
  .talk-messages,
  .talk-message-list{
    width:100% !important;
    max-width:100% !important;
    box-sizing:border-box !important;
  }

  /* Give the thread compact side gutters instead of centering a narrow column */
  .talk-thread,
  .talk-thread-inner,
  .talk-messages,
  .talk-message-list{
    padding-left:16px !important;
    padding-right:16px !important;
  }

  /* Message row begins from the left edge */
  .talk-message-row,
  .message-row,
  .chat-message-row,
  .talk-message{
    justify-content:flex-start !important;
    align-items:flex-start !important;
    text-align:left !important;
    margin-left:0 !important;
    margin-right:0 !important;
  }

  /* Sender meta / avatar align with the left edge */
  .talk-message-author,
  .message-author,
  .talk-message-head,
  .message-head{
    justify-content:flex-start !important;
    text-align:left !important;
  }

  /* Media/text bubble should not auto-center */
  .talk-message-card,
  .message-card,
  .talk-bubble,
  .message-bubble,
  .talk-message-body,
  .message-body{
    margin-left:0 !important;
    margin-right:auto !important;
    width:auto !important;
    max-width:min(88vw, 560px) !important;
    box-sizing:border-box !important;
  }

  /* Photo/video cards keep their ratio but align left */
  .talk-message-card img,
  .message-card img,
  .talk-message-card video,
  .message-card video,
  .talk-media,
  .message-media{
    display:block !important;
    margin-left:0 !important;
    margin-right:0 !important;
    max-width:100% !important;
    height:auto !important;
  }

  /* Time / actions stay connected to the message instead of floating centrally */
  .talk-message-time,
  .message-time,
  .talk-message-actions,
  .message-actions{
    margin-left:0 !important;
    margin-right:auto !important;
    text-align:left !important;
    justify-content:flex-start !important;
  }
}

@media (max-width:390px){
  .talk-thread,
  .talk-thread-inner,
  .talk-messages,

  }
}
</style>

<body>
  <header class="talk-topbar">
    <div class="talk-topbar-inner">
      <a class="talk-back" href="index.html#updates" aria-label="Back to Jen Play House">←</a>
      <div class="talk-brand">Jen Play House</div>
      <span class="talk-readonly">Read-only chat</span>
      <button class="talk-login-button" id="talkLoginButton" type="button">J-Team Login</button>
      <div class="talk-login-user" id="talkLoginUser" hidden></div>
    </div>
  </header>

  <main class="talk-index">
    <section class="talk-shell">
      <div class="talk-hero">
        <p class="talk-eyebrow">Jen & J-Team</p>
        <h1 class="talk-title">Hey! Let’s Talk <span class="talk-heart">♡</span></h1>
        <p class="talk-subtitle">Pick someone to catch up with. They might have something to tell you ♡</p>
      </div>
      <div class="talk-list" id="talkList">
        <p class="empty">Loading conversations...</p>
      </div>
    </section>
  </main>

  <section class="room" id="talkRoom" aria-hidden="true">
    <div class="room-header">
      <div class="room-header-inner">
        <button class="room-close" id="roomClose" type="button" aria-label="Back">←</button>
        <img class="room-avatar" id="roomAvatar" alt="">
        <div>
          <div class="room-person-name"><span id="roomName"></span><span class="talk-verified" id="roomVerified">✓</span></div>
          <div class="room-role" id="roomRole"></div>
        </div>
        <button class="room-menu" type="button" aria-label="More">⋮</button>
      </div>
    </div>

    <div class="room-body" id="roomMessages"></div>

    <div class="room-input">
      <div class="room-input-inner">
        <input value="Only Jen & J-Team can send messages ♡" readonly aria-label="Read-only conversation">
        <button class="room-send" id="roomComposeButton" type="button" disabled title="J-Team login required">➤</button>
      </div>
    </div>
  </section>


  <div class="talk-modal" id="talkAuthModal" hidden>
    <div class="talk-modal-card">
      <button class="talk-modal-close" type="button" data-close-modal="talkAuthModal">×</button>
      <p class="talk-modal-eyebrow">J-Team Access</p>
      <h2>Login to Talk ♡</h2>
      <p class="talk-modal-copy">Use the same registered email as the J-Team portal.</p>
      <label class="talk-field">
        <span>Email</span>
        <input id="talkLoginEmail" type="email" placeholder="you@example.com">
      </label>
      <button class="talk-primary" id="talkLoginSubmit" type="button">Continue</button>
      <div class="talk-modal-status" id="talkLoginStatus"></div>
    </div>
  </div>

  <div class="talk-modal" id="talkComposeModal" hidden>
    <div class="talk-modal-card talk-compose-card">
      <button class="talk-modal-close" type="button" data-close-modal="talkComposeModal">×</button>
      <p class="talk-modal-eyebrow">Talk With Us</p>
      <h2>Send a message</h2>
      <p class="talk-modal-copy" id="talkComposeAs"></p>

      <label class="talk-field">
        <span>Type</span>
        <select id="talkComposeType">
          <option>Text</option>
          <option>Photo</option>
          <option>Video</option>
          <option>Voice Note</option>
        </select>
      </label>

      <label class="talk-field">
        <span>Message / Caption</span>
        <textarea id="talkComposeText" rows="5" placeholder="Write something..."></textarea>
      </label>

      <label class="talk-field" id="talkComposeMediaField" hidden>
        <span>Media</span>
        <input id="talkComposeMedia" type="file" accept="image/*,video/*,audio/*">
        <small id="talkComposeMediaHint"></small>
      </label>

      <button class="talk-primary" id="talkComposeSend" type="button">Send to room</button>
      <div class="talk-modal-status" id="talkComposeStatus"></div>
    </div>
  </div>

  <script src="js/config.js?v=1.16.32-revision-2-9"></script>
  <script src="js/cms-data.js"></script>
  <script src="js/talk.js?v=1.16.32-revision-2-9"></script>
